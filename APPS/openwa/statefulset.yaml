---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openwa
  namespace: openwa
spec:
  serviceName: openwa
  replicas: 1 # MUST stay 1 until session-claim is implemented (H1/H11) — see the warning at the top of this guide
  selector:
    matchLabels:
      app: openwa
  template:
    metadata:
      labels:
        app: openwa
    spec:
      # Make the PVC writable by the in-container `openwa` user (uid/gid 997).
      # OnRootMismatch: kubelet only re-owns the volume when its root dir is wrong,
      # instead of recursively chown-ing every file in /app/data on every mount.
      securityContext:
        fsGroup: 997
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: openwa
          image: ghcr.io/rmyndharis/openwa:0.30.0
          ports:
            - containerPort: 2785
              name: http
          envFrom:
            - configMapRef:
                name: openwa-config
            - secretRef:
                name: openwa-secrets
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Container-level hardening (mirrors upstream's reference StatefulSet).
          # readOnlyRootFilesystem: every writable path must be a mounted volume:
          # /app/data (PVC) and /tmp (emptyDir below).
          # The image entrypoint starts as root to chown /app/data, then drops to the
          # `openwa` user (uid/gid 997) via gosu, so those capabilities are added back:
          #   CHOWN               chown /app/data
          #   DAC_OVERRIDE/FOWNER root must bypass file permission/ownership checks on the volume
          #   SETUID/SETGID       gosu privilege drop
          #   KILL                signal forwarding to the child process
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "KILL", "SETGID", "SETUID"]
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: openwa-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/health
              port: 2785
            initialDelaySeconds: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 2785
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        # Scratch space for the read-only root filesystem (wiped on every pod restart).
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: openwa-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
