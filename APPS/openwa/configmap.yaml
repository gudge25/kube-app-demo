---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwa-config
  namespace: openwa
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  AUTO_START_SESSIONS: "true"
  MEDIA_DOWNLOAD_ENABLED: "false"
  SEARCH_ENABLED: "false"
  ENABLE_SWAGGER: "false"
  # Traffic arrives via the Cloudflare tunnel (namespace `cloudflare`, 2 replicas on different
  # nodes; pod IPs change on restart), which connects from a pod IP and forwards the real client
  # in X-Forwarded-For. OpenWA only honours that header when the direct peer matches this list,
  # so it must cover the tunnel pods.
  # 10.42.0.0/16 is the k3s default pod CIDR (tunnel pods were 10.42.6.58 and 10.42.0.77);
  # re-check with:
  #   kubectl -n cloudflare get pod -o wide
  # Comma-separated IPs/CIDRs. A value that does not match is harmless: the header is ignored,
  # exactly as before. Keep it as narrow as the cluster allows, because any peer in this range
  # can assert an arbitrary client IP.
  TRUSTED_PROXIES: "10.42.0.0/16"
  SIMULATE_TYPING: "true"
  AUDIT_RETENTION_DAYS: "10"
  MESSAGE_RETENTION_DAYS: "14"

  DATABASE_HOST: "pgbouncer.pgbouncer.svc.cluster.local"
  DATABASE_NAME: "openwa"
  DATABASE_POOL_SIZE: "10"
  DATABASE_PORT: "5432"
  DATABASE_SSL: "false"
  DATABASE_TYPE: "postgres"
  DATABASE_USERNAME: "openwa"

  # ENGINE_TYPE: "whatsapp-web.js"
  ENGINE_TYPE: "baileys"
  BAILEYS_SYNC_FULL_HISTORY: "false"
  BAILEYS_BROWSER_NAME: "Mozilla/5.0"
  MINIO_BUILTIN: "false"
  POSTGRES_BUILTIN: "false"
  #PUPPETEER_HEADLESS: "true"
  #PUPPETEER_ARGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu"
  QUEUE_ENABLED: "true"
  REDIS_BUILTIN: "false"
  REDIS_ENABLED: "true"
  #REDIS_HOST: "XXX.aivencloud.com"
  REDIS_PORT: "21274"
  SESSION_DATA_PATH: "./data/sessions"
  STORAGE_LOCAL_PATH: "./data/media"
  STORAGE_TYPE: "local"

  # DEBUG: "puppeteer:*"
  # NODE_DEBUG: "puppeteer:*"
  # DEBUG_COLORS: "0"
  # DEBUG_MAX_STRING_LENGTH: "null"
  # PUPPETEER_ARGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu --enable-logging=stderr --v=1"
