apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/gudge25/kube-app-demo.git
    targetRevision: HEAD
    path: APPS/helm-charts/prod
    directory:
      recurse: true
      include: "*/application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

# WARNING!!!:
# Expected to have 3 applications:
# Argo CD in namespace argo-cd
# Longhorn in namespace longhorn-system
# Sealed Secrets in namespace sealed-secrets.

db:
  type: postgresdb
postgresql:
  enabled: true
redis:
  enabled: true
worker:
  mode: queue
webhook:
  mode: queue

ingress:
  enabled: true
  hosts:
    - host: n8n.ie.asteriskukraine.com
      paths:
        - path: /
          pathType: Prefix
